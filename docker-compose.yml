version: "3.9"

# ── JobSearch.ai — Production Docker Compose ──────────────────────────────────
# Usage:
#   Copy backend/.env.example -> backend/.env and fill in values
#   Then run: docker compose up --build

services:
  backend:
    build:
      # Build context is project ROOT so the ml/ package is accessible
      context: .
      dockerfile: Dockerfile.backend
    container_name: jobsearch-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      # Uncomment and set your Vercel URL after frontend deployment:
      # - FRONTEND_URL=https://your-app.vercel.app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - jobsearch-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In docker-compose the backend is reachable via service name
        - BACKEND_URL=http://backend:8000
        - NEXT_PUBLIC_API_URL=/api
    container_name: jobsearch-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jobsearch-net
    restart: unless-stopped

networks:
  jobsearch-net:
    driver: bridge
